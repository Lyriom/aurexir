server {
    listen 81;
    server_name _;

    # No revelar la versión de Nginx en cabeceras ni páginas de error.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------
    # Cabeceras de seguridad (defensa en profundidad).
    # `always` → se envían también en respuestas de error (4xx/5xx).
    # Nota: si un proxy TLS (Easypanel/Traefik) va por delante, conviene
    # fijar además HSTS en el borde (donde termina el HTTPS).
    # ---------------------------------------------------------------------

    # Content-Security-Policy: la mejor mitigación de XSS. Solo permite lo que
    # la app realmente usa: su propio bundle, Google Fonts y la API.
    #  - script-src 'self'      → el build de Vite no genera scripts inline.
    #  - style-src 'unsafe-inline' → necesario por los estilos :style de Vue
    #    y el CSS de Google Fonts (no afecta a la ejecución de scripts).
    #  - connect-src            → solo la API de AUREXIR (ajustar si cambia).
    #  - script/frame/connect *.stripe.com → checkout con tarjeta embebido
    #    (Stripe.js + iframes del Payment Element + API de Stripe).
    #  - img api.aurexir.com → fotos de productos servidas/subidas por el backend.
    set $csp "default-src 'self'";
    set $csp "${csp}; base-uri 'self'";
    set $csp "${csp}; object-src 'none'";
    set $csp "${csp}; frame-ancestors 'none'";
    set $csp "${csp}; form-action 'self'";
    set $csp "${csp}; img-src 'self' data: https://api.aurexir.com";
    set $csp "${csp}; font-src 'self' https://fonts.gstatic.com data:";
    set $csp "${csp}; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com";
    set $csp "${csp}; script-src 'self' https://js.stripe.com";
    set $csp "${csp}; frame-src https://js.stripe.com https://hooks.stripe.com";
    set $csp "${csp}; connect-src 'self' https://api.aurexir.com https://api.stripe.com";
    set $csp "${csp}; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;

    # Anti-clickjacking (frame-ancestors ya lo cubre; X-Frame-Options por
    # compatibilidad con navegadores antiguos).
    add_header X-Frame-Options "DENY" always;

    # No adivinar el MIME type (evita que un .txt se sirva/ejecute como script).
    add_header X-Content-Type-Options "nosniff" always;

    # No filtrar la URL completa como referrer a terceros.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Desactivar APIs del navegador que la tienda no usa.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # Aislar la ventana de otras pestañas (mitiga XS-Leaks / abuso de opener).
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Desactivar el auditor XSS heredado (obsoleto y con bugs propios).
    add_header X-XSS-Protection "0" always;

    # Forzar HTTPS durante 1 año (el navegador solo lo aplica sobre HTTPS).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Denegar acceso a archivos ocultos (.env, .git, etc.) por si acaso.
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
